version: '2.2'

services:

  renderer-1:
    privileged: true
    build: ../motor-js/renderer
    image: oawjs_renderer
    cpus: 2
    restart: always
    command: node /opt/prerender/server.js
    container_name: docker_oaw_renderer_1

  renderer-2:
    privileged: true
    build: ../motor-js/renderer
    image: oawjs_renderer
    cpus: 2
    restart: always
    command: node /opt/prerender/server.js
    container_name: docker_oaw_renderer_2

  renderer-3:
    privileged: true
    build: ../motor-js/renderer
    image: oawjs_renderer
    cpus: 2
    restart: always
    command: node /opt/prerender/server.js
    container_name: docker_oaw_renderer_3

  proxy:
    build: ../motor-js/proxy
    command: node /opt/proxy/index.js
    restart: always
    volumes:
      - ../motor-js/proxy/index.js:/opt/proxy/index.js
    container_name: oaw-dev-proxy
    ports:
      - 7013:7013

  nginx:
    image: nginx:1.13.8-alpine
    volumes:
      - ../motor-js/nginx/reverse.conf:/etc/nginx/conf.d/default.conf
      - ../motor-js/nginx/certs/server.crt:/etc/nginx/ssl/server.crt
      - ../motor-js/nginx/certs/server.key:/etc/nginx/ssl/server.key
    links:
      - renderer-1
      - renderer-2
      - renderer-3
    restart: always
    shm_size: 1gb

  mysql:
    image: mysql:5.7.21
    command: --max_allowed_packet=32505856
    ports:
      - 7012:3306
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./mysql/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql
      - ./volumes/mysql/:/var/lib/mysql/

  tomcat:
    build: ./tomcat
    ports:
      - 7010:8080
      - 7011:8443
    volumes:
      - ../portal/target/oaw.war:/usr/local/tomcat/webapps/oaw.war
      - ./tmp:/tmp
    container_name: oaw-dev-tomcat
    dns:
      - 192.168.4.9
      - 192.168.4.10
    links:
      - mysql
    restart: always

#Rename this file to nginx-front.conf and uncomment the relevant parts in
#docker-compose.override.yml to serve the web app via HTTPS.
server {
    listen 80 default_server;
    server_name oaw.example.com;
    location / {
        return 301 https://oaw.example.com$request_uri;
    }
    access_log /dev/stdout;
    error_log /dev/stderr;
}

server {
    ssl_certificate     /etc/ssl/certs/example.com/ssl-bundle.pem;
    ssl_certificate_key /etc/ssl/certs/example.com/privkey.pem;
    listen 443 ssl default_server;
    server_name oaw.example.com;
    location = / {
        return 302 https://oaw.example.com/oaw;
    }
    location /oaw {
        proxy_set_header  Host                $http_host;
        proxy_set_header  X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Host    $host;
        proxy_set_header  X-Forwarded-Server  $host;
        proxy_pass http://oaw:8080/oaw;
    }
    access_log /dev/stdout;
    error_log /dev/stderr;
}

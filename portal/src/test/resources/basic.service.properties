basic.service.mail.validator.fail.text      = Usted recibe este correo como respuesta a una petici\u00F3n realizada por el usuario de la Comunidad Accesibilidad "{0}" para informarle de que el an\u00E1lisis no se ha realizado correctamente, ya que el modulo de validacion no se encuentra disponible en este momento.\n\nPor favor, intente el an\u00E1lisis pasados en unos minutos y, en caso contrario, p\u00F3ngase en contacto con los administradores para informarles de la incidencia.\n\nSi usted no ha solicitado este an\u00E1lisis, por favor, elimine el correo e informe sobre ello a observ.accesibilidad@correo.gob.es.\n\n----------------------------------------------------------------\nServicio de Diagn\u00F3stico en l\u00EDnea del Observatorio de Accesibilidad Web\nSecretar\u00EDa General de Administraci\u00F3n Digital\nMinisterio de Asuntos Econ\u00F3micos y Transformaci\u00F3n Digital\nContacto: observ.accesibilidad@correo.gob.es\n
